<!DOCTYPE html>
<html>
<head>
<title>HRMS Portal</title>

<style>
body { font-family: Arial; background:#f4f6f8; padding:20px; }
.container { width:700px; margin:auto; background:white; padding:20px; border-radius:12px; }
input,select,button{width:100%;padding:10px;margin:8px 0}
button{background:#007bff;color:white;border:none}
.box{margin-top:15px;padding:10px;background:#eee;white-space:pre-wrap}
.hidden{display:none}
</style>
</head>

<body>

<div class="container">
<h2>HRMS Portal</h2>
<div id="userInfo">Loading session...</div>

<!-- HR PANEL -->
<div id="hrPanel" class="hidden">

<h3>Create Employee</h3>

<input id="name" placeholder="Full Name"/>
<input id="email" placeholder="Email"/>
<input id="department" placeholder="Department"/>
<input id="job_role" placeholder="Role"/>
<input id="manager_id" placeholder="Manager ID"/>
<input type="date" id="joining_date"/>

<select id="employment_type">
<option>Full-time</option>
<option>Intern</option>
<option>Contract</option>
</select>

<button onclick="createEmployee()">Create Employee</button>
<div id="hrResult" class="box"></div>

<hr>

<h3>All Employees</h3>
<button onclick="loadEmployees()">Load Employees</button>
<div id="employeeList" class="box"></div>

</div>

<!-- EMPLOYEE PANEL -->
<div id="employeePanel" class="hidden">

<h3>Upload Documents</h3>

<select id="docType">
<option value="id_proof">ID Proof</option>
<option value="degree_certificate">Degree</option>
<option value="signed_offer_letter">Offer Letter</option>
</select>

<input type="file" id="fileInput"/>
<button onclick="uploadDoc()">Upload</button>

<div id="uploadBox" class="box"></div>

</div>

</div>

<script>

const API = "https://y6d4fwz3y6.execute-api.ap-south-1.amazonaws.com";
const COGNITO_DOMAIN = "https://project-dev-12345.auth.ap-south-1.amazoncognito.com";
const CLIENT_ID = "7htmno079sltvuhkhkftpu7ahu";
const REDIRECT_URI = "https://dqbzdam1n62iw.cloudfront.net";

/* ================= AUTH HANDLER ================= */
(function handleAuth() {

    const url = new URL(window.location.href);
    const code = url.searchParams.get("code");

    if (code) {

        console.log("Auth code found, exchanging...");

        fetch(`${COGNITO_DOMAIN}/oauth2/token`, {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams({
                grant_type: "authorization_code",
                client_id: CLIENT_ID,
                code: code,
                redirect_uri: REDIRECT_URI
            })
        })
        .then(async (r) => {
            const data = await r.json();
            console.log("TOKEN RESPONSE:", data); // 🔥 DEBUG
            return data;
        })
        .then(tokens => {

            if (!tokens.id_token) {
                alert("Login failed. Check console.");
                return;
            }

            localStorage.setItem("id_token", tokens.id_token);
            localStorage.setItem("access_token", tokens.access_token);

            // remove ?code
            window.history.replaceState({}, document.title, window.location.origin);

            location.reload();
        })
        .catch(err => console.error("Auth error:", err));
    }
})();

/* ================= TOKEN ================= */
function getToken() {
    return localStorage.getItem("access_token");
}

/* ================= TOKEN CHECK ================= */
function isTokenExpired() {
    const token = getToken();
    if (!token) return true;

    const payload = JSON.parse(atob(token.split(".")[1]));
    const now = Math.floor(Date.now() / 1000);

    return payload.exp < now;
}

/* ================= PAYLOAD ================= */
function getPayload() {
    const token = getToken();
    if (!token) return null;

    return JSON.parse(atob(token.split(".")[1]));
}

/* ================= ROLE ================= */
function getUserRole() {
    const payload = getPayload();
    if (!payload) return null;

    const groups = payload["cognito:groups"];
    if (groups && groups.includes("HR")) return "HR";

    return "EMPLOYEE";
}

/* ================= LOAD ================= */
window.onload = function () {

    // 🔥 If no token → redirect to login
    if (!getToken() || isTokenExpired()) {

        localStorage.clear();

        window.location.href =
        `${COGNITO_DOMAIN}/login?client_id=${CLIENT_ID}` +
        `&response_type=code` +
        `&scope=email+openid` +
        `&redirect_uri=${REDIRECT_URI}`;

        return;
    }

    const role = getUserRole();

    document.getElementById("userInfo").innerText =
        "Logged in as: " + role;

    if (role === "HR") {
        hrPanel.classList.remove("hidden");
    } else {
        employeePanel.classList.remove("hidden");
    }
};

/* ================= CREATE EMPLOYEE ================= */
async function createEmployee() {

    const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        department: document.getElementById("department").value,
        role: document.getElementById("job_role").value,
        manager_id: document.getElementById("manager_id").value,
        joining_date: document.getElementById("joining_date").value,
        employment_type: document.getElementById("employment_type").value
    };

    console.log("🚀 FINAL PAYLOAD:", JSON.stringify(payload));

    const res = await fetch(`${API}/create-employee`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + getToken()
        },
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    console.log("RESPONSE:", data);

    hrResult.innerText = data.employee_id
        ? "Employee ID: " + data.employee_id
        : JSON.stringify(data);
}

/* ================= LOAD EMPLOYEES ================= */
function loadEmployees() {

    fetch(`${API}/employees`, {
        headers: { "Authorization": "Bearer " + getToken() }
    })
    .then(r => r.json())
    .then(data => {

        let output = "";

        data.forEach(emp => {
            output += 
                "Email: " + emp.email + "\n" +
                "Status: " + emp.status + "\n" +
                "Pending: " + emp.pending_docs.join(", ") + "\n\n";
        });

        employeeList.innerText = output;
    });
}

/* ================= UPLOAD ================= */
function uploadDoc() {

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function () {

        fetch("https://y6d4fwz3y6.execute-api.ap-south-1.amazonaws.com/upload-document", {
            method: "POST",
            headers: {
                Authorization: "Bearer " + localStorage.getItem("access_token"),
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                document_type: docType.value,
                file_name: file.name,
                file_content: reader.result.split(",")[1],
                content_type: file.type
            })
        })
        .then(r => r.json())
        .then(res => {
            console.log(res);
            uploadBox.innerText = "Uploaded ✔";
        });
    };

    reader.readAsDataURL(file);
}

</script>
</body>
</html>
